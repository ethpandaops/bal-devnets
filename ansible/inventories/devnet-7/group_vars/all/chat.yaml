# AI chat (panda-chat) — bal-devnet-7 pilot.
# role: ethpandaops.general.generate_kubernetes_config
#
# Prereqs:
#   - `chat` section in services.enc.yaml with llm_api_key,
#     langfuse_public_key, langfuse_secret_key. (panda_bot_username /
#     panda_bot_token only needed once chat_panda_enabled flips on —
#     Authentik service account, see chat repo docs/panda-bot-setup.md.)
#   - Cloudflare Access guard: covered by the wildcard chat.*.ethpandaops.io
#     app in ethPandaOps/cloudflare/terraform/chat.tf (allow: Ethereum Github
#     Organization). Trusted-header SSO is on by default (chat_auth_enabled).
#   - hermes-agent-panda image with the dispatch entrypoint (panda-chat chart
#     >= 0.2.0 runs the two-container pod) and panda >= 0.32.0.

gen_kubernetes_config_chat_enabled: true
# Pinned: chart 0.2.0's default tag (appVersion) predates the dispatch
# entrypoint. CI publishes to GHCR (currently private); this tag is mirrored
# to Docker Hub. <base>-<chat repo git sha>.
gen_kubernetes_config_chat_image: "ethpandaops/chat:hermes-agent-panda-2026.6.5-4c50d12"
gen_kubernetes_config_chat_chart_version: "0.3.0"
# services.enc.yaml#chat llm_api_key is an OpenRouter key (sk-or-v1-...).
gen_kubernetes_config_chat_llm_provider: "openrouter"
gen_kubernetes_config_chat_llm_api_key_env: "OPENROUTER_API_KEY"
gen_kubernetes_config_chat_llm_model: "anthropic/claude-sonnet-4.6"
# Panda on: renders the privileged panda-server sidecar and seeds the panda
# CLI config (/opt/data/.config/panda/config.yaml -> local server). Requires
# production Authentik panda-chat-svc (platform promote) + services.enc.yaml#chat
# panda_bot_username/panda_bot_token; image already ships panda 0.32.0.
gen_kubernetes_config_chat_panda_enabled: true
