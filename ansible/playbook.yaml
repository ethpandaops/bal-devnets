- hosts: ethereum_node
  become: true
  roles:
    - role: ethpandaops.general.ethereum_node
      tags: [ethereum, ethereum_node]
    - role: ethpandaops.general.traffic_control
      when: ethereum_node_cl_supernode_enabled == False
      vars:
        traffic_control_rules:
          - interface: eth0
            rate_download: 100mbit
            rate_upload: 50mbit
      tags: [traffic_control]
    - role: ethpandaops.general.traffic_control
      when: ethereum_node_cl_supernode_enabled == True
      vars:
        traffic_control_rules:
          - interface: eth0
            rate_download: 1000mbit
            rate_upload: 1000mbit
      tags: [traffic_control]

- hosts: besu
  become: true
  tags: [ethereum, ethereum_node]
  tasks:
    - name: Ensure besu heap-dumps directory exists
      ansible.builtin.file:
        path: "{{ besu_datadir | default('/data/besu') }}/heap-dumps"
        state: directory
        owner: besu
        group: besu
        mode: "0755"
    - name: Deploy besu OOM heap-dump rotate script
      ansible.builtin.copy:
        dest: "{{ besu_datadir | default('/data/besu') }}/heap-dumps/oom-rotate.sh"
        owner: besu
        group: besu
        mode: "0755"
        content: |
          #!/bin/sh
          # Invoked by the JVM via -XX:OnOutOfMemoryError after the heap dump is
          # written but before -XX:+ExitOnOutOfMemoryError terminates the process.
          # 1. Rename the just-written `heap-<pid>.hprof` with a UTC timestamp so
          #    later OOMs (where PID always resolves to 1 inside the container)
          #    don't collide and get silently skipped by HotSpot.
          # 2. Cap retention to the {{ besu_heap_dump_retain | default(3) }}
          #    most recent timestamped dumps. Each dump is ~heap-size large
          #    (-Xmx8g => ~12 GB on disk), so unbounded retention would fill
          #    the data volume after a handful of OOMs.
          set -eu
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          for SRC in /data/heap-dumps/heap-[0-9]*.hprof; do
            [ -f "${SRC}" ] || continue
            base=$(basename "${SRC}" .hprof)
            mv "${SRC}" "/data/heap-dumps/${base}-${TS}.hprof"
          done
          ls -1t /data/heap-dumps/heap-*.hprof 2>/dev/null \
            | tail -n +$(({{ besu_heap_dump_retain | default(3) }} + 1)) \
            | xargs -r rm -f --
    - name: Archive legacy root-level heap dumps into heap-dumps/
      ansible.builtin.shell: |
        set -eu
        moved=0
        for f in {{ besu_datadir | default('/data/besu') }}/heap-*.hprof; do
          [ -f "$f" ] || continue
          ts=$(stat -c '%Y' "$f")
          base=$(basename "$f" .hprof)
          mv "$f" "{{ besu_datadir | default('/data/besu') }}/heap-dumps/${base}-$(date -u -d @${ts} +%Y%m%dT%H%M%SZ)-archived.hprof"
          moved=$((moved+1))
        done
        echo "moved=${moved}"
      register: besu_heap_legacy_migration
      changed_when: "'moved=0' not in besu_heap_legacy_migration.stdout"

- hosts: ethrex
  become: true
  tags: [ethrex_connlimit]
  tasks:
    - name: Rate limit outbound p2p connection attempts (TCP)
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: "30303"
        ctstate: NEW
        limit: 5/second
        limit_burst: 10
        jump: ACCEPT
        comment: "ethrex p2p TCP conn rate limit"
    - name: Drop excess outbound p2p connections (TCP)
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: "30303"
        ctstate: NEW
        jump: DROP
        comment: "ethrex p2p TCP conn drop excess"
    - name: Rate limit outbound p2p packets (UDP)
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: udp
        destination_port: "30303"
        limit: 20/second
        limit_burst: 40
        jump: ACCEPT
        comment: "ethrex p2p UDP rate limit"
    - name: Drop excess outbound p2p packets (UDP)
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: udp
        destination_port: "30303"
        jump: DROP
        comment: "ethrex p2p UDP drop excess"
    - name: Ensure iptables directory exists
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        mode: "0755"
    - name: Persist iptables rules
      ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
      args:
        creates: /etc/iptables/rules.v4

- hosts: bootnode
  become: true
  tasks:
    - name: Refresh inventory web
      ansible.builtin.import_role:
        name: ethpandaops.general.ethereum_inventory_web
      tags: [eth_inventory_web, ethereum_inventory_web]
      when: inventory_hostname == primary_bootnode
      vars:
        eth_inventory_web_container_networks: "{{ docker_networks_shared }}" # noqa: var-naming[no-role-prefix]
        eth_inventory_web_container_env: # noqa: var-naming[no-role-prefix]
          VIRTUAL_HOST: "{{ primary_bootnode }}.{{ network_server_subdomain }}"
          VIRTUAL_PORT: "80"
          VIRTUAL_PATH: "/meta/api"
          VIRTUAL_DEST: "/"
          LETSENCRYPT_HOST: "{{ primary_bootnode }}.{{ network_server_subdomain }}"

