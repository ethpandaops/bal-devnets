- hosts: tx_fuzz_txs
  become: true
  roles:
    - role: ethpandaops.general.tx_fuzz
      tags: [tx_fuzz, tx_fuzz_txs]

- hosts: bootnode
  become: true
  roles:
    - role: ethpandaops.general.ethereum_inventory_web
      tags: [eth_inventory_web, ethereum_inventory_web]

